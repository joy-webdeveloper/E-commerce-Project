 <main>
   <section class="contact-section">
     <h2 class="register-title section_center">Contact Us</h2>
       <div class="contact-container flex_center">
         <form action="#" method="post" class="form card">
           
           <div class="from-control flex_center">
             <label for="name">Name</label>
             <input type="text" id="name" name="name" placeholder="Your User Name" required autocomplete="name">
           </div>
           
           <div class="from-control flex_center">
             <label for="email">Email</label>
             <input type="email" id="email" name="email" placeholder="Your Email Address" autocomplete="email" required>
           </div>
           
           <div class="from-control flex_center">
             <label for="message">Message</label>
             <textarea id="message" name="message" placeholder="Your Message"></textarea>
           </div>
           
           <div class="from-control flex_center from-btn_felid">
             <button type="submit" class="btn contact-btn">Submit</button>
           </div>
        </form>
        
        <div class="contact-address flex-space-around">
          <address class="address-detail">
            <h4>Address:</h4>
            <p>995 High Street</p>
            <p>Mollahat, Bagerhat</p>
            <span>Call: </span>
            <a href="tel:+01315593636">
              01315593636
            </a>
         </address>
       <div class="map-container">
         <iframe 
           src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d116833.97303522247!2d90.3372881358694!3d23.78077774438311!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13   .1!3m3!1m2!1s0x3755b8b087026b81%3A0x8fa563bbdd5904c2!2sDhaka!5e0!3m2!1sen!2sbd!4v1717367800000!5m2!1sen!2sbd" 
           allowfullscreen="" 
           loading="lazy" 
           referrerpolicy="no-referrer-when-downgrade">
          </iframe>
         </div>
        </div>
        
       </div>
     </section>
   </main>
  <!-------------footer starts hare------------>
    <footer class="footer">
      <div class="flex_around">
        <label for="subscribe">Subscribe to News Letter</label>
      <div class="wrapper">
        <input class="footer_input" type="email" id="subscribe" name="subscribe" placeholder="" required><label class="floating_label">Your Email Address</label>
        <span class="input_icon"><i class="fa-solid fa-envelope"></i></span>
       </div>
        <button class="btn btn_subscribe">Subscribe</button>
      </div>
